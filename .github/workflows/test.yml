name: test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: StarviaBackend.sln

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Covers: Accounts, AI, Calendar, Emails, Media, Platforms, Posts (*.Tests.Unit)
      - name: Run unit tests
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --verbosity normal
          --filter "FullyQualifiedName~Tests.Unit"
          --logger "trx;LogFileName=unit.trx"
          --results-directory ./TestResults

      # Covers: tests/StarviaBackend.Tests.Architecture
      - name: Run architecture tests
        run: >
          dotnet test tests/StarviaBackend.Tests.Architecture/StarviaBackend.Tests.Architecture.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=architecture.trx"
          --results-directory ./TestResults

      # Covers: Accounts, AI, Calendar, Emails, Media, Platforms, Posts (*.Tests.Integration)
      # Uses Testcontainers (Postgres) — Docker is available on ubuntu-latest
      - name: Run integration tests
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --verbosity normal
          --filter "FullyQualifiedName~Tests.Integration"
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 14
